<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="../js/mostrarUsuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>USUARIOS REGISTRADOS</h1>
        <div class="" id="listaUsuarios">
        </div>

        <div id="editarUsuarioContainer" style="display:none; margin-top:20px;">
            <h3>Editar Usuario</h3>
            <form id="formEditarUsuario">
                <input type="text" id="editarNombre" placeholder="Nombre" required>
                <input type="text" id="editarApellido" placeholder="Apellido" required>
                <input type="number" id="editarEdad" placeholder="Edad" required>
                <input type="email" id="editarEmail" placeholder="Email" required>
                <input type="text" id="editarObraSocial" placeholder="Obra Social">
                <button type="submit">Guardar cambios</button>
                <button type="button" id="cancelarEdicion">Cancelar</button>
            </form>
        </div>

        <hr>
        <a href="../index.html" class="btn">INICIO</a>
    </div>
</body>

</html>
