<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="../js/crearUsuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/styles.css" />
    <title>GESTION DE USUARIOS</title>
</head>

<body>
    <div>
        <h1>GESTION DE USUARIOS</h1>
        <div class="container">
            <form id="formUsuario">
                <input type="text" id="nombreUsuario" placeholder="Nombre" required />
                <input type="text" id="apellidoUsuario" placeholder="Apellido" required />
                <input type="number" id="edadUsuario" placeholder="Edad" required />
                <input type="mail" id="emailUsuario" placeholder="Email" required />                 
                <input type="text" id="obraSocial" placeholder="Obra Social" required />
                <button type="submit">Guardar</button>
            </form>

            <a href="../pages/lista-usuarios.html" class="btn">USUARIOS REGISTRADOS</a>
            <hr>
            <a href="../index.html" class="btn">INICIO</a>
        </div>
</body>

</html>
