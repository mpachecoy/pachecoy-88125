<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="../js/usuarios.js"></script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>Gestion de Usuarios</title>
</head>

<body>
    <div>
        <h1>GESTION DE USUARIOS</h1>
        <div class="container">
            <h2>Nuevo Usuario</h2>
            <form id="formUsuario">
                <input type="text" id="nombreUsuario" placeholder="Nombre completo" required />
                <input type="number" id="edadUsuario" placeholder="Edad" required />
                <input type="text" id="obraSocial" placeholder="Obra Social / Servicio" required />
                <button type="submit">Guardar Usuario</button>
            </form>

            <div class="usuarios">
                <h3>Usuarios Registrados</h3>
                <ul id="listaUsuarios"></ul>
            </div>
            <hr>
            <a href="../index.html" class="btn">INICIO</a>
        </div>
</body>

</html>
